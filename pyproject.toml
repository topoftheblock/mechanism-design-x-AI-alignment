[project]
name = "mdx"
version = "0.1.0"
description = "Empirical tests of 'Mechanism Design for Alignment and Control' with AI agents"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "anthropic>=2", "openai>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
